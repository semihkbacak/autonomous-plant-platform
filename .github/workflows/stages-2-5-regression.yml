name: Stage 1-5 synthetic portfolio regression (Python 3.13)
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Full regression suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci_pytest_tmp | Out-Null
          python -m pytest -q --assert=plain --tb=short --basetemp=.ci_pytest_tmp/stage1to5 tests
      - name: Independent pvlib and SQLite restart preflight
        run: python scripts/verify_stages_2_5.py
      - name: Desktop import and HTTP contracts
        run: python -m desktop.full_simulator_launcher --self-test
