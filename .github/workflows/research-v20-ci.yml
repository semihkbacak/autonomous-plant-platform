name: Research v2.0 preview integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research_v2/**"
      - "stage1/**"
      - "desktop/**"
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "requirements*.txt"
      - ".github/workflows/research-v20-ci.yml"
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install packages
        run: python -m pip install -r requirements.txt
      - name: Validate source fixtures
        run: python scripts/verify_release_assets.py
      - name: Headless native desktop self-test
        run: python -m desktop.full_simulator_launcher --self-test
      - name: Local safety and provenance preflight
        run: python scripts/security_preflight_v20.py
      - name: Run full regression with isolated temp directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci_pytest_tmp | Out-Null
          $env:TEMP=(Resolve-Path '.ci_pytest_tmp').Path
          $env:TMP=$env:TEMP
          $env:TMPDIR=$env:TEMP
          python -m pytest -q --assert=plain --tb=short --basetemp=.ci_pytest_tmp/pytest
      - name: Produce installed-package and source inventory
        shell: pwsh
        run: python scripts/supply_chain_v20.py --output .ci_pytest_tmp/source_inventory.json
